name: Traiter une commune

on:
  workflow_dispatch:
    inputs:
      commune:
        description: "Nom de la commune (ex: Sint-Truiden)"
        required: true
        type: string
      code_postal:
        description: "Code postal (ex: 3800)"
        required: true
        type: string
      rues:
        description: "Rues à traiter, séparées par des virgules (ex: Gildestraat, Gootstraat). Contrairement à la France, TOUJOURS obligatoire ici -- pas de découverte automatique de toute la commune (voir main.py)."
        required: true
        type: string
      debug:
        description: "Logs détaillés (DEBUG) -- utile pour diagnostiquer un service WFS en panne."
        required: false
        type: boolean
        default: false
      repartir_de_zero:
        description: "ATTENTION : archive le fichier Excel existant de cette commune (state/...backup-...-avant-reset.xlsx) et repart d'un fichier VIDE, pour que TOUTES les parcelles de chaque rue soient écrites dans l'ordre (un côté puis l'autre, le long de la rue). À cocher UNIQUEMENT au premier run ; si ce run s'arrête avant la fin (budget de temps), relance-le SANS cocher pour reprendre."
        required: false
        type: boolean
        default: false
      rayon_geometrique_m:
        description: "Rayon (m) autour de la route pour les parcelles SANS adresse (découverte géométrique, Wegenregister). 10 (défaut) = parcelles qui bordent la route ; 50 = jusqu'à 50 m (champs derrière, rues rurales sans numéros comme Rode Moerdijk)."
        required: false
        type: string
        default: "10"
      budget_heures:
        description: "Budget de temps interne (heures) -- le run s'arrête PROPREMENT (sauvegarde déjà faite, commit garanti) avant cette limite plutôt que de risquer que GitHub tue le job de force. Doit rester NETTEMENT sous timeout-minutes (360 min = 6h, le plafond dur GitHub) -- garder au moins 30 min d'écart."
        required: false
        type: string
        default: "5.5"

# Nécessaire pour committer l'état (Excel) à la fin du run -- l'Excel
# EST la source de vérité de progression, il doit être commité pour que
# le run suivant puisse reprendre dessus (même principe que côté
# walon-map-france-cloud).
permissions:
  contents: write

jobs:
  traiter:
    runs-on: ubuntu-latest
    # Empêche deux runs sur la MÊME commune de tourner en parallèle -- le
    # step de commit final touche le même fichier
    # state/{code_postal}_{commune}.xlsx pour les deux, un vrai conflit
    # de fusion sur un binaire n'étant pas auto-résolvable. Des communes
    # différentes restent traitées en parallèle sans souci (fichiers
    # distincts).
    concurrency:
      group: traiter-commune-${{ inputs.commune }}-${{ inputs.code_postal }}
      cancel-in-progress: false
    # Incident réel confirmé le 2026-09-16 : un run de 712 adresses (10
    # rues) a été tué par ce timeout (alors à 180 min) AVANT la fin --
    # GitHub annule alors TOUT le job, ce qui saute l'étape de commit
    # (marquée "skipped", pas "failure" : `continue-on-error` sur l'étape
    # "Lancer le traitement" ne protège PAS contre une annulation au
    # niveau du job). Résultat : 3h de traitement perdues, rien commité.
    # Double garde-fou maintenant en place : --budget-heures (main.py,
    # défaut 5h30 -- voir plus bas) s'arrête proprement AVANT cette
    # limite externe de 6h (360 min = plafond DUR des runners hébergés
    # GitHub, le maximum possible ici), qui doit TOUJOURS rester
    # strictement au-dessus du budget interne (30 min de marge pour
    # checkout/setup/pip/cache/commit/push) -- sinon on retombe
    # exactement dans l'incident du 2026-09-16 : les deux limites
    # tombant au même moment, GitHub peut tuer le job de force avant que
    # le script ait fini de s'arrêter proprement.
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      # Cache HTTP : PERFORMANCE uniquement, jamais une source de vérité
      # (voir .gitignore) -- accélère les runs répétés sur la même
      # commune, sans jamais être commité dans le repo.
      - name: Restaurer le cache HTTP
        uses: actions/cache@v4
        with:
          path: cache
          key: http-cache-${{ inputs.commune }}-${{ github.run_id }}
          restore-keys: |
            http-cache-${{ inputs.commune }}-

      # `continue-on-error` : chaque parcelle est sauvegardée
      # individuellement dans l'Excel dès qu'elle est résolue (voir
      # main.py -- `sauvegarder(wb, excel_path)` après CHAQUE parcelle,
      # rechargement immédiat), donc même un arrêt/crash en plein milieu
      # laisse un fichier cohérent sur disque -- toujours sûr à committer
      # tel quel, peu importe la cause de l'arrêt. Code de sortie 75 =
      # arrêt PROPRE et ATTENDU (budget de temps atteint, voir
      # main.py::parse_args --budget-heures) -- pas une vraie erreur.
      - name: Lancer le traitement
        id: traitement
        continue-on-error: true
        run: |
          python main.py \
            --commune "${{ inputs.commune }}" \
            --code-postal "${{ inputs.code_postal }}" \
            --rues "${{ inputs.rues }}" \
            --budget-heures "${{ inputs.budget_heures }}" \
            --rayon-geometrique-m "${{ inputs.rayon_geometrique_m }}" \
            ${{ inputs.repartir_de_zero && '--repartir-de-zero' || '' }} \
            ${{ inputs.debug && '--debug' || '' }}

      - name: Signaler un run incomplet ou en erreur
        if: steps.traitement.outcome == 'failure'
        run: echo "::warning::Le traitement de '${{ inputs.commune }}' s'est arrêté avant la fin (budget de temps atteint, ou erreur -- voir les logs ci-dessus). L'état déjà calculé est commité normalement (chaque parcelle est sauvegardée dès qu'elle est résolue) ; relance le workflow avec les MÊMES arguments pour reprendre là où ça s'est arrêté (les lignes déjà écrites sont sautées automatiquement)."

      # `git push` seul, sans re-synchro avec origin, se fait rejeter dès
      # que master a avancé depuis le checkout (ex: un push de code
      # pendant le run, un run précédent pas encore mergé) -- même
      # incident déjà vécu côté walon-map-france-cloud. `git fetch` +
      # `git rebase` avant de pousser rejoue notre commit par-dessus les
      # commits distants -- jamais un simple `push --force`, qui
      # écraserait le travail distant au lieu de le préserver.
      #
      # DEUX cas distincts pour l'échec du rebase :
      #   - Rejet SIMPLE (pas de conflit, juste un retard de
      #     synchronisation) : le rebase réussit, on retente le push --
      #     boucle de 3 tentatives pour couvrir le cas où un AUTRE push
      #     arrive pendant cette resynchronisation elle-même.
      #   - CONFLIT réel (`git rebase` échoue, contenu qui se recouvre) :
      #     seul signe possible d'un DEUXIÈME run sur la MÊME commune
      #     ayant tourné en parallèle malgré le groupe de concurrence
      #     ci-dessus. Aucune tentative de fusion automatique sur un
      #     fichier binaire (Excel) -- un openpyxl mal fusionné peut
      #     corrompre silencieusement le fichier. On abandonne le rebase
      #     proprement (`--abort`) et on échoue tout de suite.
      - name: Committer l'état (Excel) si modifié
        run: |
          git config user.name "walon-mpa-belgique-cloud bot"
          git config user.email "actions@users.noreply.github.com"
          # registry_data/ (cellules_a_revisiter.csv) DOIT être commité ici aussi --
          # bug réel confirmé le 2026-09-22 : seul state/ était ajouté, donc ce
          # fichier de suivi (créé/rempli PENDANT le run sur ce runner éphémère)
          # n'était jamais committé -- il disparaissait à la fin de CHAQUE run,
          # rendant le nouvel essai automatique en tête de main.py (voir
          # erreurs_service.py::reessayer_cellules_erreur) totalement inopérant
          # sur GitHub Actions (fonctionnait seulement en local, où ce dossier
          # persiste sur disque entre deux invocations).
          git add state/ registry_data/
          if git diff --staged --quiet; then
            echo "Rien à committer."
            exit 0
          fi
          git commit -m "Traitement automatique : ${{ inputs.commune }} (${{ inputs.code_postal }}) -- ${{ inputs.rues }}"
          for tentative in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push rejeté (tentative $tentative/3) -- resynchronisation avec origin/master avant nouvel essai."
            git fetch origin master
            if ! git rebase origin/master; then
              echo "::error::Conflit de fusion réel sur state/ (pas juste un retard de synchronisation) -- probablement un DEUXIÈME run sur la MÊME commune ayant tourné en parallèle malgré le groupe de concurrence. Aucune fusion automatique tentée sur un fichier binaire. État de CE run non commité (perdu) ; relancer le workflow pour reprendre depuis l'état déjà sur origin/master."
              git rebase --abort
              exit 1
            fi
          done
          echo "::error::Échec du push après 3 tentatives (rejets répétés sans conflit) -- état local NON perdu sur ce runner (voir logs), mais non commité côté dépôt. Relancer le workflow."
          exit 1
