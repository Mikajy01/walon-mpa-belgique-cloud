name: Traiter une commune (RUP seul)

on:
  workflow_dispatch:
    inputs:
      commune:
        description: "Nom de la commune (ex: Avelgem). Contrairement à 'Traiter une commune', AUCUNE liste de rues -- toutes les rues officielles de la commune sont découvertes automatiquement (voir main_rup.py)."
        required: true
        type: string
      code_postal:
        description: "Code postal (ex: 8580)"
        required: true
        type: string
      debug:
        description: "Logs détaillés (DEBUG) -- utile pour diagnostiquer un service WFS en panne."
        required: false
        type: boolean
        default: false
      sans_decouverte_geometrique:
        description: "Désactive la découverte géométrique (parcelles SANS adresse propre qui bordent la rue, via le tracé du Wegenregister)."
        required: false
        type: boolean
        default: false
      rayon_geometrique_m:
        description: "Rayon (m) autour de la route pour les parcelles SANS adresse. 10 (défaut) = parcelles qui bordent la route ; 50 = jusqu'à 50 m (champs derrière, rues rurales)."
        required: false
        type: string
        default: "10"
      budget_heures:
        description: "Budget de temps interne (heures) -- le run s'arrête PROPREMENT (sauvegarde déjà faite, commit garanti) avant cette limite plutôt que de risquer que GitHub tue le job de force. Doit rester NETTEMENT sous timeout-minutes (360 min = 6h, le plafond dur GitHub) -- garder au moins 30 min d'écart."
        required: false
        type: string
        default: "5.5"

# Nécessaire pour committer l'état (Excel + suivi des rues traitées) à
# la fin du run -- même principe que "Traiter une commune".
permissions:
  contents: write

jobs:
  traiter:
    runs-on: ubuntu-latest
    # Empêche deux runs sur la MÊME commune de tourner en parallèle --
    # même principe que "Traiter une commune" (voir ce workflow pour le
    # détail), fichier state/{code_postal}_{commune}_rup.xlsx partagé.
    concurrency:
      group: traiter-commune-rup-${{ inputs.commune }}-${{ inputs.code_postal }}
      cancel-in-progress: false
    # Même plafond et même raisonnement que "Traiter une commune" (voir
    # ce workflow) -- --budget-heures doit TOUJOURS rester strictement
    # sous cette limite externe, avec au moins 30 min de marge.
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      # Cache HTTP (WFS/registre d'adresses) + cache PDF (prescriptions
      # urbanistiques déjà téléchargées, voir rup_pdf_service.py) --
      # PERFORMANCE uniquement, jamais une source de vérité, jamais
      # commité (voir .gitignore). Clé séparée du pipeline 190-colonnes
      # ("-rup-") : une même commune peut être traitée par les DEUX
      # pipelines avec des historiques de cache différents.
      - name: Restaurer le cache HTTP et PDF
        uses: actions/cache@v4
        with:
          path: cache
          key: http-cache-rup-${{ inputs.commune }}-${{ github.run_id }}
          restore-keys: |
            http-cache-rup-${{ inputs.commune }}-

      # `continue-on-error` : chaque parcelle retenue est sauvegardée
      # individuellement dans l'Excel dès qu'elle est résolue (voir
      # main_rup.py), et chaque rue entièrement traitée est tracée dans
      # state/..._rup.rues-traitees.txt -- même un arrêt/crash en plein
      # milieu laisse un état cohérent, toujours sûr à committer tel
      # quel. Code de sortie 75 = arrêt PROPRE et ATTENDU (budget de
      # temps atteint), pas une vraie erreur.
      - name: Lancer le traitement
        id: traitement
        continue-on-error: true
        run: |
          python main_rup.py \
            --commune "${{ inputs.commune }}" \
            --code-postal "${{ inputs.code_postal }}" \
            --budget-heures "${{ inputs.budget_heures }}" \
            --rayon-geometrique-m "${{ inputs.rayon_geometrique_m }}" \
            ${{ inputs.sans_decouverte_geometrique && '--sans-decouverte-geometrique' || '' }} \
            ${{ inputs.debug && '--debug' || '' }}

      - name: Signaler un run incomplet ou en erreur
        if: steps.traitement.outcome == 'failure'
        run: echo "::warning::Le traitement RUP de '${{ inputs.commune }}' s'est arrêté avant la fin (budget de temps atteint, ou erreur -- voir les logs ci-dessus). L'état déjà calculé est commité normalement ; relance le workflow avec les MÊMES arguments pour reprendre là où ça s'est arrêté (rues et parcelles déjà traitées sautées automatiquement)."

      # Même mécanisme de resynchronisation (fetch + rebase + retry) que
      # "Traiter une commune" -- voir ce workflow pour le détail complet
      # des deux cas (rejet simple vs conflit réel).
      - name: Committer l'état (Excel + suivi des rues) si modifié
        run: |
          git config user.name "walon-mpa-belgique-cloud bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/
          if git diff --staged --quiet; then
            echo "Rien à committer."
            exit 0
          fi
          git commit -m "Traitement RUP automatique : ${{ inputs.commune }} (${{ inputs.code_postal }})"
          for tentative in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push rejeté (tentative $tentative/3) -- resynchronisation avec origin/master avant nouvel essai."
            git fetch origin master
            if ! git rebase origin/master; then
              echo "::error::Conflit de fusion réel sur state/ (pas juste un retard de synchronisation) -- probablement un DEUXIÈME run sur la MÊME commune ayant tourné en parallèle malgré le groupe de concurrence. Aucune fusion automatique tentée sur un fichier binaire. État de CE run non commité (perdu) ; relancer le workflow pour reprendre depuis l'état déjà sur origin/master."
              git rebase --abort
              exit 1
            fi
          done
          echo "::error::Échec du push après 3 tentatives (rejets répétés sans conflit) -- état local NON perdu sur ce runner (voir logs), mais non commité côté dépôt. Relancer le workflow."
          exit 1
